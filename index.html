<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💌 Valentine?</title>
  <style>
    :root{
      --bg1:#ffdde1;
      --bg2:#ee9ca7;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --yes:#22c55e;
      --no:#ef4444;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      overflow:hidden;
      padding:20px;
    }
    .card{
      width:min(520px, 100%);
      background:var(--card);
      backdrop-filter: blur(8px);
      border:1px solid #ffffff80;
      border-radius:24px;
      padding:26px 22px;
      text-align:center;
      box-shadow: 0 20px 50px #0000001f;
      position:relative;
    }
    h1{margin:0 0 8px; font-size: clamp(28px, 4vw, 40px); color:var(--text)}
    p{margin:0 0 18px; color:#333; opacity:.9; font-size:16px; line-height:1.35}
    .gif{
      width:100%;
      aspect-ratio: 16/9;
      border-radius:18px;
      background: linear-gradient(135deg,#ffd1dc,#fff);
      display:grid; place-items:center;
      margin: 14px 0 18px;
      overflow:hidden;
      border:1px solid #ffffffa8;
    }
    .gif img{width:100%; height:100%; object-fit:cover}
    .btns{
      display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
      margin-top:8px;
    }
    button{
      border:none;
      padding:14px 18px;
      border-radius:999px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease;
      min-width:140px;
    }
    button:active{transform: scale(0.98)}
    #yes{background:var(--yes); color:white}
    #no{background:var(--no); color:white; position:relative}
    .small{
      margin-top:14px;
      font-size:12px;
      opacity:.7;
    }
    .footer{
      display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
      margin-top:14px;
    }
    .pill{
      border:1px solid #00000010;
      background:#ffffff90;
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      cursor:pointer;
      user-select:none;
    }
    .result{
      margin-top:14px;
      font-size:18px;
      font-weight:800;
      color:#111;
      min-height:28px;
    }
    /* floating hearts */
    .heart{
      position:fixed;
      left:0; top:0;
      pointer-events:none;
      font-size:20px;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 6px 8px #00000022);
    }
    @keyframes floatUp{
      from{transform: translate(var(--x), 110vh) rotate(0deg); opacity:1}
      to{transform: translate(calc(var(--x) + 40px), -20vh) rotate(220deg); opacity:0}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p id="subtitle">I’m asking nicely (and with maximum rizz).</p>

    <div class="gif" id="media">
      <!-- Replace the image URL with any cute gif/image you want -->
      <img alt="cute" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
    </div>

    <div class="btns">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙃</button>
    </div>

    <div class="result" id="result"></div>

    <div class="footer">
      <div class="pill" id="toggleMusic">🔊 Music: Off</div>
      <div class="pill" id="copyLink">🔗 Copy Link</div>
    </div>

    <div class="small">Made with ❤️ (and a tiny bit of intimidation)</div>
  </div>

  <audio id="song" loop>
    <!-- Optional: replace with your own mp3 URL later (or remove entirely) -->
  </audio>

  <script>
    // --- Customize via URL params ---
    // Example: ?name=Sarah&from=Jack
    const params = new URLSearchParams(location.search);
    const name = params.get("name");
    const from = params.get("from");

    const subtitle = document.getElementById("subtitle");
    if (name && from) subtitle.textContent = `${name}, would you make ${from} the happiest person ever?`;
    else if (name) subtitle.textContent = `${name}, I’m asking you specifically 😌`;

    // --- Hearts ---
    function spawnHearts(count = 24){
      const emojis = ["💖","💘","💝","💕","💗","❤️","🌹"];
      for(let i=0;i<count;i++){
        const el = document.createElement("div");
        el.className = "heart";
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        const x = Math.random()*100 + "vw";
        el.style.setProperty("--x", x);
        el.style.animationDuration = (2.2 + Math.random()*2.2) + "s";
        el.style.fontSize = (16 + Math.random()*26) + "px";
        el.style.left = "0";
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 4500);
      }
    }

    // --- Buttons ---
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const result = document.getElementById("result");

    yes.addEventListener("click", () => {
      result.textContent = "YAYYY 😭💖 Ok it’s official. Valentine secured.";
      spawnHearts(60);
      // optional little vibration on mobile
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    });

    // "No" button dodges your cursor/tap (playful)
    function dodge(){
      const card = document.querySelector(".card");
      const rect = card.getBoundingClientRect();

      const padding = 16;
      const maxX = rect.width - no.offsetWidth - padding;
      const maxY = rect.height - no.offsetHeight - padding;

      const x = Math.max(padding, Math.random()*maxX);
      const y = Math.max(padding, Math.random()*maxY);

      no.style.position = "absolute";
      no.style.left = x + "px";
      no.style.top = y + "px";

      // small escalation: make "Yes" bigger each dodge
      const current = parseFloat(getComputedStyle(yes).transform.split(",")[3]) || 1;
      yes.style.transform = `scale(${Math.min(1.35, current + 0.03)})`;
    }

    // Works on desktop hover + mobile touch
    no.addEventListener("mouseenter", dodge);
    no.addEventListener("touchstart", (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
    no.addEventListener("click", dodge);

    // --- Copy link button (with name/from already set) ---
    document.getElementById("copyLink").addEventListener("click", async () => {
      const base = location.origin + location.pathname;
      const url = new URL(base);

      // If you want, prefill these manually here:
      // url.searchParams.set("name","HerName");
      // url.searchParams.set("from","YourName");

      // Or keep whatever is already in the current URL:
      if (name) url.searchParams.set("name", name);
      if (from) url.searchParams.set("from", from);

      try{
        await navigator.clipboard.writeText(url.toString());
        result.textContent = "Link copied ✅ Now go text it 😤";
      }catch{
        result.textContent = "Couldn’t auto-copy—just copy from the address bar.";
      }
    });

    // --- Optional music toggle ---
    const song = document.getElementById("song");
    const toggle = document.getElementById("toggleMusic");
    let musicOn = false;

    toggle.addEventListener("click", async () => {
      // Add your MP3 url here to enable music:
      // song.src = "https://yourdomain.com/song.mp3";
      if (!song.src) {
        result.textContent = "Add an MP3 URL in the code to enable music 🎶";
        return;
      }
      musicOn = !musicOn;
      if (musicOn) { await song.play(); toggle.textContent = "🔊 Music: On"; }
      else { song.pause(); toggle.textContent = "🔊 Music: Off"; }
    });
  </script>
</body>
</html>
