<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

.card {
  background: white;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  width: min(420px, 90%);
  position: relative;
  z-index: 2;
}

h1 {
  margin-bottom: 10px;
  font-size: 30px;
}

.subtitle {
  color: #555;
  margin-bottom: 20px;
}

.gif {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 20px;
}

button {
  padding: 14px 24px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  margin: 10px;
  cursor: pointer;
  transition: 0.2s;
}

#yes {
  background: #22c55e;
  color: white;
}

#no {
  background: #ef4444;
  color: white;
  position: relative;
}

.result {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

/* Party overlay */
#party {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  display: none;
  z-index: 1;
}

/* DJ Lights */
#lights {
  position: absolute;
  inset: 0;
  opacity: 0;
}

.beam {
  position: absolute;
  top: -40vh;
  width: 20vw;
  height: 160vh;
  opacity: 0.35;
  filter: blur(2px);
  mix-blend-mode: screen;
  animation: sweep 1.5s linear infinite;
}

.beam:nth-child(1){ left: 0vw; background: #ff0080; }
.beam:nth-child(2){ left: 20vw; background: #00ffd5; animation-delay: .2s;}
.beam:nth-child(3){ left: 40vw; background: #7c00ff; animation-delay: .4s;}
.beam:nth-child(4){ left: 60vw; background: #ffd000; animation-delay: .1s;}
.beam:nth-child(5){ left: 80vw; background: #008cff; animation-delay: .3s;}

@keyframes sweep {
  0% { transform: translateY(0) rotate(15deg); opacity: .15;}
  50% { opacity: .5;}
  100% { transform: translateY(10vh) rotate(15deg); opacity: .15;}
}

/* Confetti */
.confetti {
  position: absolute;
  top: -10vh;
  width: 10px;
  height: 16px;
  border-radius: 2px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 22px;
  animation: rise 3s linear forwards;
}

@keyframes rise {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1 id="question">Will you be my Valentine? 💘</h1>
  <div class="subtitle">I’m asking nicely (and with maximum rizz).</div>

  <img class="gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">

  <button id="yes">Yes 💖</button>
  <button id="no">No 😳</button>

  <div class="result" id="result"></div>
</div>

<!-- Party Effects -->
<div id="party">
  <div id="lights">
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
  </div>
</div>

<!-- Celebration Sound -->
<audio id="celebrate" preload="auto">
  <source src="celebrate.mp3" type="audio/mpeg">
</audio>

<script>
// Personalize via URL
const params = new URLSearchParams(window.location.search);
const name = params.get("name");
const from = params.get("from");

if (name && from) {
  document.getElementById("question").innerText =
    `${name}, will you be ${from}'s Valentine? 💘`;
}

// Buttons
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const result = document.getElementById("result");

// Yes action
yes.onclick = () => {
  result.innerText = "YAYYY 😭💖 Valentine secured.";

  // Play sound
  const s = document.getElementById("celebrate");
  s.currentTime = 0;
  s.play().catch(()=>{});

  startParty();
  spawnHearts(40);
};

// Dodging No button
no.onmouseover = () => {
  const x = Math.random()*200 - 100;
  const y = Math.random()*200 - 100;
  no.style.transform = `translate(${x}px, ${y}px)`;
};

// Hearts
function spawnHearts(n){
  for(let i=0;i<n;i++){
    const h = document.createElement("div");
    h.className = "heart";
    h.innerText = "💖";
    h.style.left = Math.random()*100 + "vw";
    h.style.animationDuration = (2 + Math.random()*2) + "s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 4000);
  }
}

// Party mode
function startParty(){
  const party = document.getElementById("party");
  const lights = document.getElementById("lights");

  party.style.display = "block";
  lights.style.opacity = "1";

  const colors = ["#ff3b7f","#22c55e","#60a5fa","#fbbf24","#a855f7","#fb7185"];

  for(let i=0;i<150;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2 + Math.random()*3) + "s";
    party.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }

  setTimeout(()=>{
    lights.style.opacity = "0";
  }, 4000);

  setTimeout(()=>{
    party.style.display = "none";
  }, 6000);
}
</script>

</body>
</html>
