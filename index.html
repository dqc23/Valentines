<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💌 Valentine?</title>

  <style>
    :root{
      --bg1:#ffdde1;
      --bg2:#ee9ca7;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --yes:#22c55e;
      --no:#ef4444;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}

    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      overflow:hidden;
      padding:20px;
    }

    .card{
      width:min(520px, 100%);
      background:var(--card);
      backdrop-filter: blur(8px);
      border:1px solid #ffffff80;
      border-radius:24px;
      padding:26px 22px;
      text-align:center;
      box-shadow: 0 20px 50px #0000001f;
      position:relative;
    }

    h1{margin:0 0 8px; font-size: clamp(28px, 4vw, 40px); color:var(--text)}
    p{margin:0 0 18px; color:#333; opacity:.9; font-size:16px; line-height:1.35}

    .gif{
      width:100%;
      aspect-ratio: 16/9;
      border-radius:18px;
      overflow:hidden;
      margin: 14px 0 18px;
    }
    .gif img{width:100%; height:100%; object-fit:cover}

    .btns{
      display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
      margin-top:8px;
    }

    button{
      border:none;
      padding:14px 18px;
      border-radius:999px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      min-width:140px;
    }

    #yes{background:var(--yes); color:white}
    #no{background:var(--no); color:white; position:relative}

    .result{
      margin-top:14px;
      font-size:18px;
      font-weight:800;
      min-height:28px;
    }

    /* Floating hearts */
    .heart{
      position:fixed;
      pointer-events:none;
      font-size:20px;
      animation: floatUp linear forwards;
    }

    @keyframes floatUp{
      from{transform: translateY(100vh); opacity:1}
      to{transform: translateY(-20vh); opacity:0}
    }

    /* Dinner popup */
    #dinnerPopup{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      display:none;
      place-items:center;
      z-index:999;
    }

    .popupCard{
      background:white;
      padding:28px;
      border-radius:20px;
      text-align:center;
      width:min(360px, 90%);
      box-shadow:0 20px 50px rgba(0,0,0,0.25);
      animation: popIn .25s ease;
    }

    @keyframes popIn{
      from{transform:scale(.8); opacity:0}
      to{transform:scale(1); opacity:1}
    }

    .popupBtns{
      margin-top:16px;
      display:flex;
      gap:10px;
      justify-content:center;
    }

    .popupBtns button{
      min-width:120px;
      border-radius:12px;
      padding:12px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p id="subtitle">I’m asking nicely (and with maximum rizz).</p>

    <div class="gif">
      <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
    </div>

    <div class="btns">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙃</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <!-- Celebration sound -->
  <audio id="song" preload="auto">
    <source src="celebrate.mp3" type="audio/mpeg">
  </audio>

  <!-- Dinner Popup -->
  <div id="dinnerPopup">
    <div class="popupCard">
      <h2>Dinner Friday? 🍽️</h2>
      <p>I’ll plan everything.</p>

      <div class="popupBtns">
        <button id="dinnerYes" style="background:#22c55e;color:white;">Yes!</button>
        <button id="dinnerNo" style="background:#ef4444;color:white;">Maybe</button>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const name = params.get("name");
  const from = params.get("from");
  const subtitle = document.getElementById("subtitle");

  if (name && from) subtitle.textContent = `${name}, would you make ${from} the happiest person ever?`;

  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const result = document.getElementById("result");
  const song = document.getElementById("song");
  const popup = document.getElementById("dinnerPopup");

  // Hearts
  function spawnHearts(count=40){
    for(let i=0;i<count;i++){
      const h = document.createElement("div");
      h.className="heart";
      h.textContent="💖";
      h.style.left=Math.random()*100+"vw";
      h.style.animationDuration=(2+Math.random()*2)+"s";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),4000);
    }
  }

  // YES click
  yes.addEventListener("click", async ()=>{
    result.textContent="YAYYY 😭💖 Ok it’s official. Valentine secured.";
    spawnHearts(60);

    try{
      song.currentTime = 0;
      await song.play();
    }catch(e){}

    if(navigator.vibrate) navigator.vibrate([60,40,60]);

    // Show dinner popup after short delay
    setTimeout(()=>{
      popup.style.display="grid";
    },1200);
  });

  // Dodge No
  function dodge(){
    const x=Math.random()*200-100;
    const y=Math.random()*200-100;
    no.style.transform=`translate(${x}px,${y}px)`;
  }
  no.addEventListener("mouseenter",dodge);
  no.addEventListener("touchstart",(e)=>{e.preventDefault();dodge();},{passive:false});

  // Dinner responses
  document.getElementById("dinnerYes").onclick=()=>{
    popup.innerHTML = `
      <div class="popupCard">
        <h2>It’s a date 😌💘</h2>
        <p>Friday is locked in.</p>
      </div>
    `;
  };

  document.getElementById("dinnerNo").onclick=()=>{
    popup.style.display="none";
  };
</script>

</body>
</html>
